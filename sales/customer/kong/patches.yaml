_format_version: "1.0"

patches:
  - selectors:
    - $.services[?(@.name=="customer-information-service")]
    values:
      host: customer.kongair
      port: 8083
      protocol: http
      plugins:
        - name: jwt
          _config: default-jwt
          enabled: true
        - name: request-transformer-advanced
          enabled: true
          configs: 
            add: 
              body: []
              headers:
              - X-Powered-By:Konnect!!
              
